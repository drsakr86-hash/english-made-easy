*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:#f6f7f9;color:#1f2937}
#root{max-width:720px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:#6b7280;font-size:14px;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:1px solid #d1d5db;background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:#1f2937;color:#fff;border-color:#1f2937}
.bar{height:8px;background:#e5e7eb;border-radius:4px;margin:8px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:#16a34a}
.row{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:9px;font:inherit;cursor:pointer}
.btn.on{background:#2563eb;color:#fff;border-color:#2563eb}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px}
.en{font-size:19px;font-weight:700;direction:ltr;text-align:left}
.ar{font-size:16px;margin-top:2px}
.ex{direction:ltr;text-align:left;color:#4b5563;font-size:14px;margin-top:8px}
.exar{color:#6b7280;font-size:13px}
.small{font-size:13px;color:#6b7280}
.opt{display:block;width:100%;text-align:right;border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:10px;margin-top:8px;font:inherit;cursor:pointer}
.opt.en2{direction:ltr;text-align:left}
.opt.ok{background:#dcfce7;border-color:#16a34a}
.opt.bad{background:#fee2e2;border-color:#dc2626}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ic{border:none;background:none;font-size:20px;cursor:pointer;padding:0}
.rule{background:#eff6ff;border-radius:8px;padding:10px;margin-top:8px;font-size:15px;line-height:1.8}
.next{margin-top:12px;width:100%;border:none;background:#1f2937;color:#fff;border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.score{text-align:center;font-size:20px;padding:20px}
</style>

function store(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function Options({opts,answer,onDone,en}){
  const [pick,setPick]=useState(null);
  return <div>{opts.map((o,i)=>{
    let c="opt"+(en?" en2":"");
    if(pick!==null){ if(i===answer)c+=" ok"; else if(i===pick)c+=" bad"; }
    return <button key={i} className={c} disabled={pick!==null} onClick={()=>{setPick(i);onDone(i===answer)}}>{o}</button>
  })}</div>;
}

function Quiz({qs,onFinish}){
  const [i,setI]=useState(0);const [s,setS]=useState(0);const [done,setDone]=useState(false);const [ans,setAns]=useState(false);
  if(i>=qs.length) return <div className="card score">النتيجة: {s} من {qs.length}<div><button className="next" onClick={onFinish}>رجوع</button></div></div>;
  const q=qs[i];
  return <div className="card">
    <div className="small">سؤال {i+1} / {qs.length}</div>
    <div className={q.enQ?"en":"ar"} style={{marginTop:6}}>{q.q}</div>
    {q.sub&&<div className="small">{q.sub}</div>}
    <Options key={i} opts={q.opts} answer={q.a} en={q.enOpts} onDone={ok=>{setAns(true);if(ok)setS(s+1)}}/>
    {ans&&q.note&&<div className="rule">{q.note}</div>}
    {ans&&<button className="next" onClick={()=>{setI(i+1);setAns(false)}}>{i+1===qs.length?"إنهاء":"التالي"}</button>}
  </div>;
}

function vocabQuiz(list){
  return shuffle(list).slice(0,10).map(it=>{
    const wrong=shuffle(list.filter(x=>x.ar!==it.ar)).slice(0,3).map(x=>x.ar);
    const opts=shuffle([it.ar,...wrong]);
    return {q:it.en,enQ:true,opts,a:opts.indexOf(it.ar),note:it.ex+" — "+it.exAr};
  });
}
function grammarQuiz(lesson){
  return lesson.q.map(x=>({q:x[0],enQ:true,opts:x[1],a:x[2],enOpts:true,note:lesson.r}));
}
function compoundQuiz(){
  return shuffle(C).slice(0,10).map(x=>({q:x.en,enQ:true,sub:x.ar,opts:x.o,a:x.a,enOpts:true,note:x.n}));
}

function VocabSection({id,list}){
  const [known,setKnown]=useState(()=>store("k_"+id,[]));
  const [mode,setMode]=useState("learn");
  const [qs,setQs]=useState(null);
  const [filter,setFilter]=useState("all");
  useEffect(()=>save("k_"+id,known),[known]);
  const toggle=en=>setKnown(k=>k.includes(en)?k.filter(x=>x!==en):[...k,en]);
  const pct=Math.round(known.length/list.length*100);
  if(qs) return <Quiz qs={qs} onFinish={()=>setQs(null)}/>;
  const shown=list.filter(x=>filter==="all"||(filter==="known"?known.includes(x.en):!known.includes(x.en)));
  return <div>
    <div className="small">أتقنت {known.length} من {list.length}</div>
    <div className="bar"><i style={{width:pct+"%"}}/></div>
    <div className="row">
      <button className="btn on" onClick={()=>setQs(vocabQuiz(list))}>ابدأ اختباراً</button>
      <button className={"btn"+(filter==="all"?" on":"")} onClick={()=>setFilter("all")}>الكل</button>
      <button className={"btn"+(filter==="new"?" on":"")} onClick={()=>setFilter("new")}>لم أتقنها</button>
    </div>
    {shown.map(it=><div className="card" key={it.en}>
      <div className="top">
        <div><div className="en">{it.en}</div><div className="ar">{it.ar}</div></div>
        <div><button className="ic" onClick={()=>speak(it.en)} title="نطق">🔊</button> <button className="ic" onClick={()=>toggle(it.en)} title="أتقنتها">{known.includes(it.en)?"✅":"⬜"}</button></div>
      </div>
      <div className="ex">{it.ex}</div><div className="exar">{it.exAr}</div>
    </div>)}
  </div>;
}

function GrammarSection(){
  const [open,setOpen]=useState(null);
  const [qs,setQs]=useState(null);
  const [done,setDone]=useState(()=>store("k_grammar",[]));
  useEffect(()=>save("k_grammar",done),[done]);
  if(qs) return <Quiz qs={qs.q} onFinish={()=>{setDone(d=>d.includes(qs.t)?d:[...d,qs.t]);setQs(null)}}/>;
  return <div>
    <div className="small">أنهيت {done.length} من {G.length} درساً</div>
    <div className="bar"><i style={{width:done.length/G.length*100+"%"}}/></div>
    {G.map((l,i)=><div className="card" key={i}>
      <div className="top" onClick={()=>setOpen(open===i?null:i)} style={{cursor:"pointer"}}>
        <div className="ar" style={{fontWeight:700}}>{l.t}</div><div>{done.includes(l.t)?"✅":"›"}</div>
      </div>
      {open===i&&<div><div className="rule">{l.r}</div><button className="next" onClick={()=>setQs({t:l.t,q:grammarQuiz(l)})}>تمرين</button></div>}
    </div>)}
  </div>;
}

function CompoundSection(){
  const [qs,setQs]=useState(null);
  const [best,setBest]=useState(()=>store("k_compound",0));
  const [open,setOpen]=useState(false);
  if(qs) return <Quiz qs={qs} onFinish={()=>setQs(null)}/>;
  return <div>
    <div className="row"><button className="btn on" onClick={()=>setQs(compoundQuiz())}>ابدأ اختباراً</button>
    <button className="btn" onClick={()=>setOpen(!open)}>{open?"أخفِ الأدوات":"أدوات الربط"}</button></div>
    {open&&<div className="card rule">and: إضافة · but: تناقض · so: نتيجة · because: سبب · or: اختيار · although: رغم أن · however: ومع ذلك · when/while/until: زمن · who/which/where/whose: جمل وصل · if/unless: شرط</div>}
    {C.map((x,i)=><div className="card" key={i}>
      <div className="en">{x.en.replace("___","____")}</div>
      <div className="ar">{x.ar}</div>
      <div className="small">الأداة: <b style={{direction:"ltr",display:"inline-block"}}>{x.o[x.a]}</b> — {x.n}</div>
    </div>)}
  </div>;
}

function App(){
  const [tab,setTab]=useState(()=>store("tab","words"));
  useEffect(()=>save("tab",tab),[tab]);
  return <div>
    <h1>English Made Easy</h1>
    <div className="sub">كلمات · تعبيرات · مصطلحات · قواعد · جمل مركبة</div>
    <div className="tabs">{SECTIONS.map(s=><button key={s[0]} className={"tab"+(tab===s[0]?" on":"")} onClick={()=>setTab(s[0])}>{s[1]}</button>)}</div>
    <div style={{marginTop:10}}>
      {tab==="words"&&<VocabSection key="w" id="words" list={W}/>}
      {tab==="expr"&&<VocabSection key="e" id="expr" list={E}/>}
      {tab==="idioms"&&<VocabSection key="i" id="idioms" list={I}/>}
      {tab==="grammar"&&<GrammarSection/>}
      {tab==="compound"&&<CompoundSection/>}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
